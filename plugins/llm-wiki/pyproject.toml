[project]
name = "llmwiki"
version = "0.1.0"
description = "Immutable engine for an LLM-maintained wiki (path-import, no-install)."
requires-python = ">=3.11"
# Runtime dependencies are intentionally NOT declared here: the package is
# consumed by path-import (no-install), and runtime deps (duckdb, markdown) are
# declared per-entrypoint via PEP 723 inline metadata on the bin/ scripts, not
# installed through this project. See package-cli-architecture spec
# (no-install / DEC-1 area-split entrypoints).
dependencies = []

[project.optional-dependencies]
# `doc` extra: documentation-build tooling group. Declared per spec; contents
# are added when the doc build is wired up.
doc = []

[dependency-groups]
# Test-environment group. Area runtime deps appear here — and ONLY here, never
# in `[project].dependencies` — when the test suite imports the area module
# directly and so cannot go through the entrypoint that carries the PEP 723
# declaration: `duckdb` for `ingest`, `markdown`/`nh3` for `view`
# (bin/llmwiki-view declares those two inline).
dev = [
    "duckdb>=1.5.5",
    "markdown>=3.10.3",
    "nh3>=0.3.6",
    "pytest>=9.1.1",
]
